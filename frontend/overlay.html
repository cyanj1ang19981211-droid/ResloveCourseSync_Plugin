<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程强度同步</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2027;
    --border: #2a2e37;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #4da3ff;
    --green: #3ddc84;
    --red: #ff6b6b;
    --amber: #ffb347;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    width: 100%;
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .header .title { font-size: 12px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .segment {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
    min-height: 28px;
    line-height: 1.2;
    flex: 0 0 auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .segment.empty { color: var(--muted); }

  .nextline {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    min-height: 18px;
    flex: 0 0 auto;
  }
  .remaining {
    color: var(--amber);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .next {
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .next .next-name {
    color: var(--accent);
    font-weight: 600;
  }

  .subline {
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex: 0 0 auto;
  }
  .keyword-tag {
    background: var(--amber);
    color: #1a1204;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .intensity-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .intensity-tag.high {
    background: var(--red);
    color: #2a0a0a;
  }
  .intensity-tag.mid {
    background: var(--amber);
    color: #1a1204;
  }
  .intensity-tag.low {
    background: var(--green);
    color: #0a2a14;
  }

  .metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 0 0 auto;
  }
  .metrics:empty { display: none; }
  .metric {
    flex: 1 1 auto;
    min-width: 90px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .metric .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .metric .value {
    font-size: 21px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .metric .unit { font-size: 11px; color: var(--muted); margin-left: 2px; }

  /* 折线图区：占据剩余高度，窗口多大就画多大（不再写死 80px） */
  .curve-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    flex: 1 1 auto;
    min-height: 56px;
    display: flex;
    flex-direction: column;
  }
  .curve-box .caption {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    gap: 12px;
    flex: 0 0 auto;
  }
  .legend { display: flex; align-items: center; gap: 4px; }
  .legend .swatch { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .canvas-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 底部一行：左侧状态 + 右侧「清除课件缓存」按钮（同一行，不会互相遮挡） */
  .bottomrow {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-height: 22px;
  }
  .statuscol { flex: 1 1 auto; min-width: 0; }
  .status {
    font-size: 11px;
    color: var(--muted);
    min-height: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mode {
    font-size: 10px;
    color: var(--muted);
    min-height: 14px;
    font-family: "Consolas", monospace;
  }

  .clear-btn {
    flex: 0 0 auto;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: color .15s, border-color .15s, background .15s;
  }
  .clear-btn:hover {
    color: var(--red);
    border-color: var(--red);
    background: rgba(255, 107, 107, 0.08);
  }
  .clear-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ------------------------------------------------------------------
     小窗口适配：默认初始尺寸约 260x230（1080p 下屏宽 13.5% × 屏高 22%），
     内容区只有 ~260x196，所以整体收一档字号/间距，保证不溢出、不用滚动。
     用户把窗口拉大后媒体查询失效，自动回到上面这套宽松样式。
     ------------------------------------------------------------------ */
  @media (max-height: 320px), (max-width: 340px) {
    body { padding: 6px; gap: 4px; }
    .header .title { font-size: 11px; }
    .segment { font-size: 14px; min-height: 18px; letter-spacing: 0; }
    .nextline, .subline { font-size: 11px; min-height: 14px; }
    .keyword-tag, .intensity-tag { font-size: 10px; padding: 1px 6px; }
    .metrics { gap: 5px; }
    .metric { min-width: 58px; padding: 3px 6px; border-radius: 6px; }
    .metric .label { font-size: 9px; margin-bottom: 0; }
    .metric .value { font-size: 14px; }
    .metric .unit { font-size: 9px; }
    .curve-box { padding: 5px; min-height: 42px; border-radius: 6px; }
    .curve-box .caption { font-size: 9px; margin-bottom: 2px; gap: 8px; }
    .bottomrow { min-height: 16px; gap: 6px; }
    .status { font-size: 10px; min-height: 12px; }
    .mode { display: none; }
    .clear-btn { padding: 3px 8px; font-size: 10px; border-radius: 5px; }
  }

</style>
</head>
<body>
  <div class="header">
    <span class="dot" id="dot"></span>
    <span class="title" id="title">课程强度同步</span>
  </div>

  <div class="segment empty" id="segment">— 等待同步 —</div>

  <div class="nextline">
    <span class="remaining" id="remaining"></span>
    <span class="next" id="next"></span>
  </div>

  <div class="subline">
    <span id="action"></span>
    <span class="intensity-tag" id="intensity" style="display:none"></span>
    <span class="keyword-tag" id="keyword" style="display:none"></span>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="curve-box" id="curveBox">
    <div class="caption">
      <span class="legend" id="mainLegend" style="display:none"><span class="swatch" style="background:var(--accent)"></span><span id="mainLegendLabel"></span></span>
      <span class="legend" id="subLegend" style="display:none"><span class="swatch" style="background:var(--amber)"></span><span id="subLegendLabel"></span></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="curve"></canvas>
    </div>
  </div>

  <div class="bottomrow">
    <div class="statuscol">
      <div class="status" id="status">正在连接服务...</div>
      <div class="mode" id="mode"></div>
    </div>
    <button class="clear-btn" id="clearBtn" type="button">清除课件缓存</button>
  </div>

<script>
// 后端端口：由 overlay.py 打开窗口时通过 ?port= 传入（页面是 file:// 打开的，
// 读不到 config.json）。默认 8765，与 server.py / config.json 保持一致。
const PORT = (new URLSearchParams(location.search).get("port") || "8765");
const BASE = "http://127.0.0.1:" + PORT;
const API = BASE + "/state";

let el = {
  dot: document.getElementById("dot"),
  title: document.getElementById("title"),
  segment: document.getElementById("segment"),
  action: document.getElementById("action"),
  keyword: document.getElementById("keyword"),
  intensity: document.getElementById("intensity"),
  remaining: document.getElementById("remaining"),
  next: document.getElementById("next"),
  metrics: document.getElementById("metrics"),
  curve: document.getElementById("curve"),
  curveBox: document.getElementById("curveBox"),
  status: document.getElementById("status"),
  mode: document.getElementById("mode"),
  mainLegend: document.getElementById("mainLegend"),
  subLegend: document.getElementById("subLegend"),
  mainLegendLabel: document.getElementById("mainLegendLabel"),
  subLegendLabel: document.getElementById("subLegendLabel"),
  clearBtn: document.getElementById("clearBtn"),
};

// 数值格式化：整数显示整数，小数保留 1 位
function fmt(v) {
  if (typeof v === "number") {
    let r = Math.round(v * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  }
  return v;
}

function renderMetrics(values, fieldMeta) {
  el.metrics.innerHTML = "";
  if (!fieldMeta || fieldMeta.length === 0) return;
  for (const fm of fieldMeta) {
    const raw = values[fm.key];
    if (raw === undefined || raw === null) continue;
    const card = document.createElement("div");
    card.className = "metric";
    card.innerHTML =
      '<div class="label">' + fm.label + '</div>' +
      '<div class="value">' + fmt(raw) + '<span class="unit">' + (fm.unit || "") + '</span></div>';
    el.metrics.appendChild(card);
  }
}

function drawCurve(curve, timeNow) {
  const canvas = el.curve;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  // 窗口还没布局完（或极小）时 clientWidth/Height 可能是 0，直接跳过避免异常
  if (w <= 1 || h <= 1) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const kind = curve.kind || "metric";

  // 图例
  if (kind === "intensity") {
    el.mainLegend.style.display = "";
    el.mainLegendLabel.textContent = "强度（0~1 连续）";
    const hasReps = (curve.reps_vals || []).some(v => v != null);
    el.subLegend.style.display = hasReps ? "" : "none";
    el.subLegendLabel.textContent = "个数";
    drawIntensityCurve(ctx, curve, w, h);
  } else {
    const hasMain = curve.main_label && (curve.main || []).some(v => v !== null && v !== undefined);
    const hasSub = curve.sub_label && (curve.sub || []).some(v => v !== null && v !== undefined);
    el.mainLegend.style.display = hasMain ? "" : "none";
    if (hasMain) el.mainLegendLabel.textContent = curve.main_label;
    el.subLegend.style.display = hasSub ? "" : "none";
    if (hasSub) el.subLegendLabel.textContent = curve.sub_label;
    drawMetricCurve(ctx, curve, w, h);
  }

  // 播放头位置竖线（两种模式通用）
  if (timeNow !== null && timeNow !== undefined) {
    const t0 = curve.kind === "intensity"
      ? (curve.intensity_times?.[0] ?? 0)
      : (curve.times?.[0] ?? 0);
    const t1 = curve.kind === "intensity"
      ? (curve.intensity_times?.[curve.intensity_times.length - 1] ?? 0)
      : (curve.times?.[curve.times.length - 1] ?? 0);
    if (t1 > t0) {
      const px = (Math.min(Math.max(timeNow, t0), t1) - t0) / (t1 - t0) * w;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, h);
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawMetricCurve(ctx, curve, w, h) {
  // 器械课：主曲线（速度/踏频/桨频）+ 副曲线（坡度/阻力）
  const times = curve.times || [];
  const main = curve.main || [];
  const sub = curve.sub || [];
  const hasMain = curve.main_label && main.some(v => v !== null && v !== undefined);
  const hasSub = curve.sub_label && sub.some(v => v !== null && v !== undefined);

  if (!hasMain && !hasSub) return;
  if (times.length < 2) return;
  const t0 = times[0], t1 = times[times.length - 1];
  const x = t => (t - t0) / (t1 - t0) * w;

  if (hasMain) {
    const vals = main.map(v => (v === null || v === undefined) ? 0 : v);
    let mn = Math.min(...vals), mx = Math.max(...vals);
    if (mn === mx) { mn -= 1; mx += 1; }
    const y = v => 4 + (mx - v) / (mx - mn) * (h - 8);
    ctx.beginPath();
    ctx.moveTo(x(times[0]), y(vals[0]));
    for (let i = 1; i < times.length; i++) ctx.lineTo(x(times[i]), y(vals[i]));
    ctx.strokeStyle = "#4da3ff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  if (hasSub) {
    const vals = sub.map(v => (v === null || v === undefined) ? 0 : v);
    let mn = Math.min(...vals), mx = Math.max(...vals);
    if (mn === mx) { mn -= 1; mx += 1; }
    const y = v => 4 + (mx - v) / (mx - mn) * (h - 8);
    ctx.beginPath();
    ctx.moveTo(x(times[0]), y(vals[0]));
    for (let i = 1; i < times.length; i++) ctx.lineTo(x(times[i]), y(vals[i]));
    ctx.strokeStyle = "#ffb347";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawIntensityCurve(ctx, curve, w, h) {
  // 徒手课：把每段小动作画成「连续强度」阶梯图。
  // 每段强度是一个 0~1 的 score（由动作类型规则表打分），
  // 用色阶映射：score 越高越红、越低越绿，休息/介绍 = 灰色凹槽。
  // 叠 reps 副线（散点+连线，琥珀色）体现每个小节的数量。
  const steps = curve.steps || [];
  if (!steps.length) return;
  const t0 = steps[0].start;
  const t1 = steps[steps.length - 1].end;
  if (!(t1 > t0)) return;
  const x = t => (t - t0) / (t1 - t0) * w;

  // 纵向：score 0 在底部、1 在顶部。留出底部 6px 给 score≈0 的"休息"段
  const topY = 4;
  const baseY = h - 6;
  const yScore = score => topY + (1 - score) * (baseY - topY);

  // 色阶：score 0→1 从灰绿渐变到红
  //   0.0（休息）→ 深灰；0.15 拉伸 → 绿；0.5 核心 → 黄绿；0.7 抗阻 → 橙；0.95 爆发 → 红
  function scoreColor(score) {
    if (score <= 0.01) return "rgba(120,128,138,0.30)";   // 休息/介绍 = 灰
    // 0.01~1.0：绿(60,200,120) → 黄(255,200,60) → 红(255,80,80) 三段渐变
    const r = score < 0.5 ? 60 + (255 - 60) * (score / 0.5) * 0.3
              : 255;
    const g = score < 0.5 ? 200 : 200 - (200 - 80) * ((score - 0.5) / 0.5);
    const b = score < 0.5 ? 120 - 60 * (score / 0.5) : 60 - 20 * ((score - 0.5) / 0.5);
    return "rgba(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + ",0.85)";
  }

  // 强度阶梯填充
  for (const s of steps) {
    const x0 = x(s.start);
    const x1 = x(s.end);
    const wSeg = Math.max(1, x1 - x0);
    const score = (typeof s.score === "number") ? s.score : (s.intensity === "high" ? 0.95 : s.intensity === "mid" ? 0.5 : 0.2);
    ctx.fillStyle = scoreColor(score);
    ctx.fillRect(x0, yScore(score), wSeg, baseY - yScore(score));
  }

  // 强度阶梯线（描边，让阶梯转折更清晰）
  ctx.beginPath();
  let prevScore = (typeof steps[0].score === "number") ? steps[0].score : 0.2;
  ctx.moveTo(x(steps[0].start), yScore(prevScore));
  for (const s of steps) {
    const score = (typeof s.score === "number") ? s.score : (s.intensity === "high" ? 0.95 : s.intensity === "mid" ? 0.5 : 0.2);
    ctx.lineTo(x(s.start), yScore(score));
    ctx.lineTo(x(s.end), yScore(score));
  }
  ctx.strokeStyle = "rgba(232,234,237,0.35)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // reps 副线（散点 + 连线，琥珀色），画在顶部窄带，避免与强度色块混叠
  const repsTimes = curve.reps_times || [];
  const repsVals = curve.reps_vals || [];
  const validPts = repsTimes
    .map((t, i) => ({ t, v: repsVals[i] }))
    .filter(p => p.v != null);
  if (validPts.length >= 1) {
    const vs = validPts.map(p => p.v);
    let mn = Math.min(...vs), mx = Math.max(...vs);
    if (mn === mx) { mn -= 1; mx += 1; }
    // 副线压在顶部 0~18px 的窄带内
    const yReps = v => 2 + (mx - v) / (mx - mn) * 14;
    ctx.strokeStyle = "#ffb347";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < validPts.length; i++) {
      const px = x(validPts[i].t);
      const py = yReps(validPts[i].v);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      ctx.lineTo(x(Math.min(t1, validPts[i].t + 1)), py);
    }
    ctx.stroke();
    ctx.fillStyle = "#ffb347";
    for (const p of validPts) {
      ctx.beginPath();
      ctx.arc(x(p.t), yReps(p.v), 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// fetch 超时（毫秒）：fusionscript 的 native 调用会阻塞 GIL，HTTP 可能短暂卡住，
// 给客户端加超时避免一直转圈
const FETCH_TIMEOUT_MS = 3000;

// 连续失败计数：只有连续失败 >= 2 次才把 status 切换为"同步中断"，
// 避免 fusionscript 短暂卡顿导致的"无法连接"提示闪烁
let failStreak = 0;

async function poll() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const r = await fetch(API, { cache: "no-store", signal: ctrl.signal });
    const s = await r.json();
    clearTimeout(timer);
    failStreak = 0;

    el.dot.className = "dot" + (s.connected ? " on" : "");

    if (s.course_loaded) {
      el.title.textContent = (s.title || s.course_name) + " · " + s.timeline_name;
      el.segment.textContent = s.segment || "—";
      el.segment.className = "segment" + (s.segment ? "" : " empty");
      el.action.textContent = s.action || "";
      if (s.keyword) {
        el.keyword.style.display = "";
        el.keyword.textContent = s.keyword;
      } else {
        el.keyword.style.display = "none";
      }
      // 徒手课强度标签（三档：高强度=红、中强度=橙、低强度=绿），并附连续强度分
      if (s.intensity === "high" || s.intensity === "mid" || s.intensity === "low") {
        el.intensity.style.display = "";
        el.intensity.className = "intensity-tag " + s.intensity;
        const label = s.intensity === "high" ? "高强度" : s.intensity === "mid" ? "中强度" : "低强度";
        const score = (typeof s.intensity_score === "number") ? " " + Math.round(s.intensity_score * 100) + "%" : "";
        el.intensity.textContent = label + score;
      } else {
        el.intensity.style.display = "none";
      }
      // 当前环节剩余时间（倒计时）
      if (s.segment_remaining != null && s.segment_remaining > 0) {
        el.remaining.textContent = "剩余 " + formatTime(s.segment_remaining);
      } else {
        el.remaining.textContent = "";
      }
      // 下一小环节预告（point 粒度，比 segment 粒度更细，能看到间歇组里每段冲刺/恢复）
      if (s.next_step && s.next_step.name) {
        const until = (s.next_step.start || 0) - (s.time_seconds || 0);
        el.next.innerHTML = '下一小环节 <span class="next-name">' + s.next_step.name + '</span> · ' + formatTime(Math.max(0, until)) + ' 后';
      } else {
        el.next.textContent = "";
      }
      renderMetrics(s.values, s.field_meta);
      drawCurve(s.curve, s.time_seconds);
      // 显示 worker 模式（直传/外推/封顶），便于诊断"播放不前进"是不是 worker 端卡住
      const mode = s.mode || "?";
      const modeIcon = mode === "raw" ? "●" : mode === "外推" ? "◐" : "○";
      const modeColor = mode === "raw" ? "var(--green)" : mode === "外推" ? "var(--amber)" : "var(--muted)";
      el.status.textContent = "已同步 · " + formatTime(s.time_seconds);
      el.mode.textContent = modeIcon + " " + mode;
      el.mode.style.color = modeColor;
    } else {
      el.title.textContent = "课程强度同步";
      // connected=false 表示还在等达芬奇（可能插件先开、达芬奇后开），
      // 给个明确文案，而不是让人以为「没数据」。
      const waiting = !s.connected;
      el.segment.textContent = waiting ? "等待达芬奇…" : "— 等待同步 —";
      el.segment.className = "segment" + (waiting ? "" : " empty");
      el.action.textContent = "";
      el.keyword.style.display = "none";
      el.intensity.style.display = "none";
      el.remaining.textContent = "";
      el.next.textContent = "";
      el.metrics.innerHTML = "";
      drawCurve({ kind: "metric", times: [], main: [], sub: [], main_label: "", sub_label: "" }, null);
      el.status.textContent = s.message || "未同步";
      el.mode.textContent = "";
    }
  } catch (e) {
    clearTimeout(timer);
    failStreak += 1;
    el.dot.className = "dot";
    if (failStreak >= 2) {
      el.status.textContent = "同步中断，正在重连…";
    }
    // 失败时不清空已显示的数据（让画面保持上次状态，避免闪烁）
  }
}

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  return pad(m) + ":" + pad(s);
}

// 清除课件缓存：删除 data/ 下所有转换生成的 JSON（防止同名课件匹配到旧数据）
async function clearCache() {
  const sure = confirm("确定要清除所有课件缓存（data/*.json）吗？\n\n清除后需重新运行 convert.bat 生成课程数据，否则将无法匹配任何课程。");
  if (!sure) return;

  el.clearBtn.disabled = true;
  const originalText = el.clearBtn.textContent;
  el.clearBtn.textContent = "清除中…";
  el.status.textContent = "正在清除课件缓存…";

  try {
    const r = await fetch(BASE + "/clear_cache", { method: "POST" });
    const res = await r.json();
    if (res.ok) {
      el.status.textContent = res.message + "，已清空内存缓存";
    } else {
      el.status.textContent = res.message || "清除失败";
    }
  } catch (e) {
    el.status.textContent = "清除失败：无法连接服务";
  } finally {
    el.clearBtn.disabled = false;
    el.clearBtn.textContent = originalText;
  }
}

el.clearBtn.addEventListener("click", clearCache);

// 关窗时通知后端退出：后端在后台默默跑着（没有窗口），如果这里不发信号，
// 用户关掉悬浮窗后它就变成看不见的僵尸进程，下次启动还占着 8765 端口。
// sendBeacon 在 pagehide/beforeunload 里依然能发出去，比 fetch 可靠。
function notifyShutdown() {
  const url = BASE + "/shutdown";
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(url, "1");
      return;
    }
  } catch (e) { /* 落到下面的 fetch */ }
  try {
    fetch(url, { method: "POST", keepalive: true });
  } catch (e) { /* 页面正在卸载，发不出去也没关系，后端有空闲兜底 */ }
}

window.addEventListener("pagehide", notifyShutdown);
window.addEventListener("beforeunload", notifyShutdown);

poll();
setInterval(poll, 150);
</script>
